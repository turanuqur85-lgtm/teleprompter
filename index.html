<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<meta name="apple-mobile-web-app-capable"
content="yes">

<meta name="apple-mobile-web-app-status-bar-style"
content="black">

<title>Teleprompter Pro</title>


<style>

/* =====================================================
   TEMEL
===================================================== */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html {
    margin: 0;
    padding: 0;
    background: #000;
}

body {

    margin: 0;
    padding: 0;

    background: #000;
    color: #fff;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    overflow-x: hidden;
    overflow-y: auto;

    min-height: 100vh;
}


/* =====================================================
   PROMPTER
===================================================== */

#prompter {

    position: relative;

    width: 100%;

    min-height: 100vh;

    background: #000;
}


/* =====================================================
   METİN
===================================================== */

#text {

    width: 90%;

    margin-left: auto;
    margin-right: auto;

    text-align: center;

    white-space: pre-wrap;

    word-wrap: break-word;

    font-size: 60px;

    line-height: 1.4;

    font-weight: 600;

    color: #fff;

    padding-top: 45vh;

    padding-bottom: 100vh;

    transform-origin:
        center center;

    transition:
        width .15s ease,
        font-size .15s ease;

}


/* =====================================================
   OKUMA ÇİZGİSİ
===================================================== */

#readingLine {

    position: fixed;

    left: 0;
    right: 0;

    top: 45vh;

    height: 2px;

    background:
        rgba(255,255,255,0.12);

    pointer-events: none;

    z-index: 50;
}


/* =====================================================
   DURUM BAR
===================================================== */

#statusBar {

    position: fixed;

    top: 15px;

    left: 50%;

    transform:
        translateX(-50%);

    z-index: 1000;

    display: flex;

    align-items: center;

    gap: 10px;

    padding:
        8px 15px;

    border-radius: 20px;

    background:
        rgba(20,20,20,.82);

    color: #aaa;

    font-size: 14px;

    pointer-events: none;

    transition:
        opacity .25s;

}


/* =====================================================
   DURUM NOKTASI
===================================================== */

.status-dot {

    width: 9px;
    height: 9px;

    border-radius: 50%;

    background: #555;

}

.status-dot.ready {
    background: #36d278;
}

.status-dot.playing {
    background: #36d278;
}

.status-dot.paused {
    background: #f2b84b;
}


/* =====================================================
   SES GÖSTERGESİ
===================================================== */

#voiceIndicator {

    position: fixed;

    right: 15px;
    top: 15px;

    z-index: 1000;

    display: none;

    padding:
        8px 12px;

    border-radius: 20px;

    background:
        rgba(20,20,20,.85);

    color: #aaa;

    font-size: 13px;

    pointer-events: none;

}

#voiceIndicator.listening {

    display: block;

    color: #6de69e;

}


/* =====================================================
   KONTROL PANELİ
===================================================== */

#controls {

    position: fixed;

    left: 20px;
    right: 20px;

    bottom: 20px;

    z-index: 2000;

    padding: 18px;

    border-radius: 18px;

    background:
        rgba(20,20,20,.95);

    backdrop-filter:
        blur(12px);

    box-shadow:
        0 10px 40px
        rgba(0,0,0,.5);

    transition:
        opacity .25s,
        transform .25s;

}


/* =====================================================
   SATIR
===================================================== */

.control-row {

    display: flex;

    align-items: center;

    gap: 10px;

    margin-bottom: 12px;

    flex-wrap: wrap;

}

.control-row:last-child {

    margin-bottom: 0;

}


/* =====================================================
   METİN KUTUSU
===================================================== */

#inputText {

    width: 100%;

    min-height: 120px;

    resize: none;

    border:
        1px solid #333;

    border-radius: 12px;

    background: #090909;

    color: white;

    padding: 15px;

    font-size: 18px;

    line-height: 1.5;

    outline: none;

}

#inputText:focus {

    border-color: #777;

}


/* =====================================================
   BUTONLAR
===================================================== */

button {

    border: none;

    border-radius: 10px;

    padding:
        13px 18px;

    background: #292929;

    color: white;

    font-size: 16px;

    font-weight: 600;

    cursor: pointer;

    user-select: none;

    touch-action: manipulation;

}

button:active {

    transform:
        scale(.96);

}

#startButton {

    background: #fff;

    color: #000;

}

.activeButton {

    background:
        #175f39 !important;

    color: white !important;

}

.navigationButton {

    min-width: 90px;

}


/* =====================================================
   SLIDER
===================================================== */

.slider-group {

    display: flex;

    align-items: center;

    gap: 10px;

    flex: 1;

    min-width: 260px;

}

.slider-group label {

    font-size: 14px;

    color: #aaa;

    white-space: nowrap;

    min-width: 110px;

}

input[type="range"] {

    flex: 1;

}


/* =====================================================
   GERİ SAYIM
===================================================== */

#countdown {

    position: fixed;

    inset: 0;

    z-index: 5000;

    display: none;

    align-items: center;

    justify-content: center;

    background:
        rgba(0,0,0,.88);

    font-size:
        min(25vw,220px);

    font-weight: bold;

    color: white;

}


/* =====================================================
   ÇEKİM MODU
===================================================== */

body.presentation-mode #controls {

    opacity: 0;

    pointer-events: none;

    transform:
        translateY(40px);

}

body.presentation-mode #statusBar {

    opacity: 0;

}

body.presentation-mode #voiceIndicator {

    opacity: 0;

}

body.presentation-mode #readingLine {

    opacity: 0;

}


/* =====================================================
   ÇEKİM MODU BİLGİ
===================================================== */

#presentationHint {

    position: fixed;

    left: 50%;

    bottom: 30px;

    transform:
        translateX(-50%);

    z-index: 8000;

    padding:
        10px 18px;

    border-radius: 25px;

    background:
        rgba(30,30,30,.9);

    color: #aaa;

    font-size: 14px;

    display: none;

    pointer-events: none;

}


/* =====================================================
   MOBİL
===================================================== */

@media (max-width:700px) {

    #controls {

        left: 10px;
        right: 10px;
        bottom: 10px;

        padding: 12px;

    }

    #text {

        font-size: 46px;

    }

    button {

        padding:
            12px 14px;

        font-size: 15px;

    }

    #inputText {

        min-height: 95px;

    }

    .slider-group {

        min-width: 100%;

    }

}

</style>

</head>


<body>


<!-- =====================================================
     GERİ SAYIM
===================================================== -->

<div id="countdown">
    3
</div>


<!-- =====================================================
     DURUM
===================================================== -->

<div id="statusBar">

    <span
        id="statusDot"
        class="status-dot">
    </span>

    <span id="statusText">
        Hazır
    </span>

</div>


<!-- =====================================================
     SES
===================================================== -->

<div id="voiceIndicator">
    🎙 Dinliyor
</div>


<!-- =====================================================
     ÇEKİM MODU BİLGİ
===================================================== -->

<div id="presentationHint">

    Çıkmak için çift dokun
    veya
    "çekimden çık" de

</div>


<!-- =====================================================
     PROMPTER
===================================================== -->

<div id="prompter">

    <div id="text">

        Teleprompter metninizi
        aşağıdaki kutuya yazın.

    </div>

</div>


<!-- =====================================================
     OKUMA ÇİZGİSİ
===================================================== -->

<div id="readingLine"></div>


<!-- =====================================================
     KONTROLLER
===================================================== -->

<div id="controls">


    <!-- METİN -->

    <div class="control-row">

        <textarea
            id="inputText"
            placeholder="Teleprompter metnini buraya yapıştır..."></textarea>

    </div>


    <!-- ANA KONTROLLER -->

    <div class="control-row">


        <button
            id="startButton"
            onclick="startCountdown()">

            ▶ Başlat

        </button>


        <button
            onclick="togglePlayPause()">

            ⏯ Dur / Devam

        </button>


        <button
            onclick="restartText()">

            ↺ Başa Dön

        </button>


        <button
            id="mirrorButton"
            onclick="toggleMirror()">

            ⇄ Mirror

        </button>


        <button
            onclick="enterPresentationMode()">

            🎬 Çekim Modu

        </button>


        <button
            id="voiceButton"
            onclick="toggleVoiceControl()">

            🎙 Sesli Kontrol

        </button>


    </div>


    <!-- İLERİ GERİ -->

    <div class="control-row">


        <button
            class="navigationButton"
            onclick="moveBackward()">

            ◀ Geri

        </button>


        <button
            class="navigationButton"
            onclick="moveForward()">

            İleri ▶

        </button>


    </div>


    <!-- HIZ -->

    <div class="control-row">

        <div class="slider-group">

            <label>
                Hız
            </label>

            <input
                type="range"
                id="speed"
                min="0.25"
                max="8"
                step="0.25"
                value="2">

            <span id="speedValue">
                2
            </span>

        </div>

    </div>


    <!-- YAZI BOYUTU -->

    <div class="control-row">

        <div class="slider-group">

            <label>
                Yazı Boyutu
            </label>

            <input
                type="range"
                id="fontSize"
                min="30"
                max="120"
                step="2"
                value="60">

            <span id="fontSizeValue">
                60
            </span>

        </div>

    </div>


    <!-- METİN GENİŞLİĞİ -->

    <div class="control-row">

        <div class="slider-group">

            <label>
                Metin Genişliği
            </label>

            <input
                type="range"
                id="textWidth"
                min="35"
                max="96"
                step="1"
                value="90">

            <span id="textWidthValue">
                90%
            </span>

        </div>

    </div>


</div>



<script>

/* =====================================================
   ELEMENTLER
===================================================== */

const textElement =
    document.getElementById("text");

const inputText =
    document.getElementById("inputText");

const countdownElement =
    document.getElementById("countdown");

const speedSlider =
    document.getElementById("speed");

const speedValue =
    document.getElementById("speedValue");

const fontSizeSlider =
    document.getElementById("fontSize");

const fontSizeValue =
    document.getElementById("fontSizeValue");

const textWidthSlider =
    document.getElementById("textWidth");

const textWidthValue =
    document.getElementById("textWidthValue");

const statusText =
    document.getElementById("statusText");

const statusDot =
    document.getElementById("statusDot");

const voiceButton =
    document.getElementById("voiceButton");

const voiceIndicator =
    document.getElementById("voiceIndicator");

const presentationHint =
    document.getElementById("presentationHint");

const controls =
    document.getElementById("controls");


/* =====================================================
   DEĞİŞKENLER
===================================================== */

let isPlaying = false;

let animationFrame = null;

let countdownRunning = false;

let isMirror = false;

let voiceEnabled = false;

let recognition = null;

let lastFrameTime = 0;

let lastTapTime = 0;


/*
   Manuel ileri / geri
*/

const jumpAmount = 400;


/* =====================================================
   STATUS
===================================================== */

function setStatus(
    text,
    type = "ready"
) {

    statusText.innerText =
        text;

    statusDot.className =
        "status-dot " + type;

}


/* =====================================================
   METİN YÜKLE
===================================================== */

function loadText() {

    const content =
        inputText.value.trim();


    textElement.innerText =
        content ||
        "Teleprompter metninizi aşağıdaki kutuya yazın.";

}


/* =====================================================
   AYARLARI UYGULA
===================================================== */

function applySettings() {

    speedValue.innerText =
        speedSlider.value;


    fontSizeValue.innerText =
        fontSizeSlider.value;


    textWidthValue.innerText =
        textWidthSlider.value + "%";


    textElement.style.fontSize =
        fontSizeSlider.value + "px";


    textElement.style.width =
        textWidthSlider.value + "%";


    loadText();

}


/* =====================================================
   AYARLARI YÜKLE
===================================================== */

function loadSettings() {

    const savedText =
        localStorage.getItem(
            "prompterText"
        );

    const savedSpeed =
        localStorage.getItem(
            "prompterSpeed"
        );

    const savedFont =
        localStorage.getItem(
            "prompterFont"
        );

    const savedWidth =
        localStorage.getItem(
            "prompterWidth"
        );


    if (
        savedText !== null
    ) {

        inputText.value =
            savedText;

    }


    if (
        savedSpeed !== null
    ) {

        speedSlider.value =
            savedSpeed;

    }


    if (
        savedFont !== null
    ) {

        fontSizeSlider.value =
            savedFont;

    }


    if (
        savedWidth !== null
    ) {

        textWidthSlider.value =
            savedWidth;

    }


    applySettings();

}


/* =====================================================
   BAŞA DÖN
===================================================== */

function restartText() {

    stopScrolling();

    window.scrollTo(
        0,
        0
    );

    setStatus(
        "Başa döndü",
        "ready"
    );

}


/* =====================================================
   GERİ SAYIM
===================================================== */

function startCountdown() {

    if (countdownRunning)
        return;


    loadText();

    stopScrolling();


    window.scrollTo(
        0,
        0
    );


    countdownRunning =
        true;


    countdownElement.style.display =
        "flex";


    let count = 3;


    countdownElement.innerText =
        count;


    const timer =
        setInterval(
            function() {


                count--;


                if (
                    count >= 0
                ) {

                    countdownElement.innerText =
                        count;

                }


                if (
                    count < 0
                ) {

                    clearInterval(
                        timer
                    );


                    countdownElement.style.display =
                        "none";


                    countdownRunning =
                        false;


                    startScrolling();

                }


            },
            1000
        );

}


/* =====================================================
   BAŞLAT
===================================================== */

function startScrolling() {

    if (isPlaying)
        return;


    isPlaying =
        true;


    lastFrameTime =
        performance.now();


    setStatus(
        "Oynatılıyor",
        "playing"
    );


    animationFrame =
        requestAnimationFrame(
            scrollLoop
        );

}


/* =====================================================
   DUR
===================================================== */

function stopScrolling() {

    isPlaying =
        false;


    if (
        animationFrame
    ) {

        cancelAnimationFrame(
            animationFrame
        );

        animationFrame =
            null;

    }


    setStatus(
        "Duraklatıldı",
        "paused"
    );

}


/* =====================================================
   OYNAT / DUR
===================================================== */

function togglePlayPause() {

    if (
        countdownRunning
    )
        return;


    if (isPlaying) {

        stopScrolling();

    } else {

        startScrolling();

    }

}


/* =====================================================
   SCROLL MOTORU
===================================================== */

function scrollLoop(timestamp) {

    if (!isPlaying)
        return;


    const delta =
        timestamp -
        lastFrameTime;


    lastFrameTime =
        timestamp;


    const speed =
        Number(
            speedSlider.value
        );


    const movement =
        speed *
        delta /
        16.67;


    window.scrollBy(
        0,
        movement
    );


    animationFrame =
        requestAnimationFrame(
            scrollLoop
        );

}


/* =====================================================
   ÖZEL MİKTARDA İLERİ
===================================================== */

function moveForwardAmount(
    amount
) {

    window.scrollBy({

        top: amount,

        behavior: "smooth"

    });

}


/* =====================================================
   ÖZEL MİKTARDA GERİ
===================================================== */

function moveBackwardAmount(
    amount
) {

    window.scrollBy({

        top: -amount,

        behavior: "smooth"

    });

}


/* =====================================================
   NORMAL İLERİ
===================================================== */

function moveForward() {

    moveForwardAmount(
        jumpAmount
    );

}


/* =====================================================
   NORMAL GERİ
===================================================== */

function moveBackward() {

    moveBackwardAmount(
        jumpAmount
    );

}


/* =====================================================
   MIRROR
===================================================== */

function toggleMirror() {

    isMirror =
        !isMirror;


    textElement.style.transform =
        isMirror
        ? "scaleX(-1)"
        : "scaleX(1)";


    document
        .getElementById(
            "mirrorButton"
        )
        .classList
        .toggle(
            "activeButton",
            isMirror
        );

}


/* =====================================================
   ÇEKİM MODUNA GİR
===================================================== */

function enterPresentationMode() {

    document.body.classList.add(
        "presentation-mode"
    );


    presentationHint.style.display =
        "block";


    setTimeout(
        function() {

            presentationHint.style.display =
                "none";

        },
        3500
    );

}


/* =====================================================
   ÇEKİM MODUNDAN ÇIK
===================================================== */

function exitPresentationMode() {

    document.body.classList.remove(
        "presentation-mode"
    );


    presentationHint.style.display =
        "none";


    /*
       Kullanıcıya çıktığını göster.
    */

    setStatus(
        isPlaying
        ? "Oynatılıyor"
        : "Duraklatıldı",
        isPlaying
        ? "playing"
        : "paused"
    );

}


/* =====================================================
   ÇİFT TIK
===================================================== */

document.addEventListener(
    "click",
    function(event) {


        /*
           Kontrol panelindeki normal
           butonları engelleme.
        */

        if (
            controls.contains(
                event.target
            )
        ) {

            return;

        }


        const now =
            Date.now();


        const difference =
            now -
            lastTapTime;


        /* =============================================
           ÇEKİM MODU
        ============================================= */

        if (
            document.body.classList.contains(
                "presentation-mode"
            )
        ) {


            /*
               Çift dokunma
               = çekim modundan çık
            */

            if (
                difference > 0 &&
                difference < 450
            ) {

                exitPresentationMode();

                lastTapTime =
                    0;

                return;

            }


            /*
               Tek dokunma
               = PLAY / PAUSE
            */

            if (
                !countdownRunning
            ) {

                togglePlayPause();

            }


            lastTapTime =
                now;

            return;

        }


        /* =============================================
           NORMAL MOD
        ============================================= */

        if (
            !countdownRunning
        ) {

            togglePlayPause();

        }


        lastTapTime =
            now;

    },
    true
);


/* =====================================================
   HIZ
===================================================== */

speedSlider.addEventListener(
    "input",
    function() {

        speedValue.innerText =
            speedSlider.value;


        localStorage.setItem(
            "prompterSpeed",
            speedSlider.value
        );

    }
);


/* =====================================================
   YAZI BOYUTU
===================================================== */

fontSizeSlider.addEventListener(
    "input",
    function() {

        textElement.style.fontSize =
            fontSizeSlider.value +
            "px";


        fontSizeValue.innerText =
            fontSizeSlider.value;


        localStorage.setItem(
            "prompterFont",
            fontSizeSlider.value
        );

    }
);


/* =====================================================
   METİN GENİŞLİĞİ
===================================================== */

textWidthSlider.addEventListener(
    "input",
    function() {

        const width =
            textWidthSlider.value;


        textElement.style.width =
            width + "%";


        textWidthValue.innerText =
            width + "%";


        localStorage.setItem(
            "prompterWidth",
            width
        );

    }
);


/* =====================================================
   METİN OTOMATİK KAYIT
===================================================== */

inputText.addEventListener(
    "input",
    function() {

        loadText();


        localStorage.setItem(
            "prompterText",
            inputText.value
        );

    }
);


/* =====================================================
   SES TANIMA SİSTEMİ
===================================================== */

function setupVoiceRecognition() {


    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


    if (
        !SpeechRecognition
    ) {

        voiceButton.innerText =
            "🎙 Ses Desteklenmiyor";


        voiceButton.disabled =
            true;


        return;

    }


    recognition =
        new SpeechRecognition();


    recognition.lang =
        "tr-TR";


    recognition.continuous =
        true;


    recognition.interimResults =
        false;


    recognition.onstart =
        function() {

            voiceIndicator.classList.add(
                "listening"
            );

        };


    recognition.onend =
        function() {

            voiceIndicator.classList.remove(
                "listening"
            );


            if (
                voiceEnabled
            ) {

                setTimeout(
                    function() {

                        try {

                            recognition.start();

                        } catch(e) {}

                    },
                    500
                );

            }

        };


    recognition.onerror =
        function(event) {

            console.log(
                "Ses tanıma:",
                event.error
            );

        };


    recognition.onresult =
        function(event) {


            const last =
                event.results.length - 1;


            const command =
                event.results[last][0]
                    .transcript
                    .toLowerCase()
                    .trim();


            console.log(
                "Algılanan ses:",
                command
            );


            handleVoiceCommand(
                command
            );

        };

}


/* =====================================================
   SESLİ KONTROLÜ AÇ / KAPAT
===================================================== */

function toggleVoiceControl() {


    if (!recognition)
        return;


    voiceEnabled =
        !voiceEnabled;


    if (
        voiceEnabled
    ) {


        voiceButton.classList.add(
            "activeButton"
        );


        voiceButton.innerText =
            "🎙 Ses Açık";


        try {

            recognition.start();

        } catch(e) {}


    } else {


        voiceButton.classList.remove(
            "activeButton"
        );


        voiceButton.innerText =
            "🎙 Sesli Kontrol";


        try {

            recognition.stop();

        } catch(e) {}

    }

}


/* =====================================================
   SESLİ KOMUT ANALİZİ
===================================================== */

function handleVoiceCommand(
    command
) {


    /*
       Safari bazen noktalama işaretleri
       veya fazladan boşluklar döndürebilir.
    */

    command =
        command
            .toLowerCase()
            .replace(/[.,!?]/g, "")
            .replace(/\s+/g, " ")
            .trim();


    console.log(
        "İşlenen komut:",
        command
    );


    /* =================================================
       ÇEKİM MODUNDAN ÇIK
       
       BUNU EN BAŞA KOYUYORUZ.
    ================================================= */

    if (
        command.includes(
            "çekimden çık"
        ) ||

        command.includes(
            "çekim modundan çık"
        ) ||

        command.includes(
            "normal moda geç"
        ) ||

        command.includes(
            "kontrolleri göster"
        ) ||

        command.includes(
            "ayarları göster"
        )
    ) {

        exitPresentationMode();

        return;

    }


    /* =================================================
       ÇEKİM MODU
    ================================================= */

    if (
        command.includes(
            "çekim modu"
        ) ||

        command === "çekim"
    ) {

        enterPresentationMode();

        return;

    }


    /* =================================================
       BAŞLAT
    ================================================= */

    if (
        command.includes(
            "başlat"
        ) ||

        command === "başla"
    ) {

        startCountdown();

        return;

    }


    /* =================================================
       DURAKLAT
    ================================================= */

    if (
        command.includes(
            "duraklat"
        ) ||

        command === "dur"
    ) {

        stopScrolling();

        return;

    }


    /* =================================================
       DEVAM
    ================================================= */

    if (
        command.includes(
            "devam"
        ) ||

        command.includes(
            "sürdür"
        ) ||

        command.includes(
            "devam et"
        )
    ) {

        startScrolling();

        return;

    }


    /* =================================================
       BAŞA DÖN
    ================================================= */

    if (
        command.includes(
            "başa dön"
        ) ||

        command.includes(
            "başa"
        ) ||

        command.includes(
            "başlangıca"
        ) ||

        command.includes(
            "sıfırla"
        )
    ) {

        restartText();

        return;

    }


    /* =================================================
       MIRROR
    ================================================= */

    if (
        command.includes(
            "ayna"
        ) ||

        command.includes(
            "mirror"
        ) ||

        command.includes(
            "yansıt"
        )
    ) {

        toggleMirror();

        return;

    }


    /* =================================================
       İLERİ KOMUTLARI
    ================================================= */


    /*
       ÖNCE "ÇOK İLERİ"
    */

    if (
        command.includes(
            "çok ileri"
        ) ||

        command.includes(
            "fazla ileri"
        ) ||

        command.includes(
            "hızlı ileri"
        )
    ) {

        moveForwardAmount(
            jumpAmount * 2.5
        );

        return;

    }


    /*
       "BİRAZ İLERİ"
    */

    if (
        command.includes(
            "biraz ileri"
        ) ||

        command.includes(
            "az ileri"
        )
    ) {

        moveForwardAmount(
            jumpAmount * 0.5
        );

        return;

    }


    /*
       "X SANİYE İLERİ"

       Örneğin:

       5 saniye ileri
       10 saniye ileri
    */

    const forwardSeconds =
        extractSeconds(
            command
        );


    if (
        forwardSeconds !== null &&
        (
            command.includes(
                "ileri"
            ) ||

            command.includes(
                "ilerlet"
            )
        )
    ) {

        /*
           Mevcut otomatik hız:

           speed px / frame

           Yaklaşık 60 frame / saniye.

           Bu yüzden:

           saniye × hız × 60
        */

        const speed =
            Number(
                speedSlider.value
            );


        const amount =
            forwardSeconds *
            speed *
            60;


        moveForwardAmount(
            amount
        );

        return;

    }


    /*
       NORMAL İLERİ

       "ileri"
       "ileri al"
       "ilerlet"
       "yazıyı ileri al"
       "metni ileri al"
       "ileriye al"
    */

    if (
        command.includes(
            "ileri"
        ) ||

        command.includes(
            "ilerlet"
        ) ||

        command.includes(
            "ileriye"
        )
    ) {

        moveForward();

        return;

    }


    /* =================================================
       GERİ KOMUTLARI
    ================================================= */


    /*
       ÇOK GERİ
    */

    if (
        command.includes(
            "çok geri"
        ) ||

        command.includes(
            "fazla geri"
        ) ||

        command.includes(
            "hızlı geri"
        )
    ) {

        moveBackwardAmount(
            jumpAmount * 2.5
        );

        return;

    }


    /*
       BİRAZ GERİ
    */

    if (
        command.includes(
            "biraz geri"
        ) ||

        command.includes(
            "az geri"
        )
    ) {

        moveBackwardAmount(
            jumpAmount * 0.5
        );

        return;

    }


    /*
       X SANİYE GERİ
    */

    const backwardSeconds =
        extractSeconds(
            command
        );


    if (
        backwardSeconds !== null &&
        (
            command.includes(
                "geri"
            ) ||

            command.includes(
                "geriye"
            )
        )
    ) {

        const speed =
            Number(
                speedSlider.value
            );


        const amount =
            backwardSeconds *
            speed *
            60;


        moveBackwardAmount(
            amount
        );

        return;

    }


    /*
       NORMAL GERİ
    */

    if (
        command.includes(
            "geri"
        ) ||

        command.includes(
            "geriye"
        )
    ) {

        moveBackward();

        return;

    }


    /*
       EŞLEŞME YOK
    */

    console.log(
        "Komut eşleşmedi:",
        command
    );

}


/* =====================================================
   SANİYE TESPİTİ
===================================================== */

function extractSeconds(
    command
) {


    /*
       Rakam şeklinde:

       "5 saniye ileri"

       "10 saniye geri"
    */

    const numberMatch =
        command.match(
            /(\d+(?:[.,]\d+)?)\s*saniye/
        );


    if (
        numberMatch
    ) {

        return parseFloat(
            numberMatch[1]
                .replace(",", ".")
        );

    }


    /*
       Türkçe sayı kelimeleri
    */

    const numbers = {

        "bir": 1,
        "iki": 2,
        "üç": 3,
        "dört": 4,
        "beş": 5,
        "altı": 6,
        "yedi": 7,
        "sekiz": 8,
        "dokuz": 9,
        "on": 10

    };


    for (
        const word in numbers
    ) {

        if (
            command.includes(
                word + " saniye"
            )
        ) {

            return numbers[word];

        }

    }


    return null;

}


/* =====================================================
   KLAVYE YEDEĞİ
===================================================== */

document.addEventListener(
    "keydown",
    function(event) {


        /*
           ESC

           Çekim modundan çık
        */

        if (
            event.key === "Escape"
        ) {

            exitPresentationMode();

        }


        /*
           SPACE

           Play / Pause
        */

        if (
            event.code === "Space" &&

            document.activeElement !==
            inputText
        ) {

            event.preventDefault();

            togglePlayPause();

        }

    }
);

===================================================== */

loadSettings();

setupVoiceRecognition();

setStatus(
    "Hazır",
    "ready"
);


console.log(

);

console.log(
    "BLE-M3 Yukarı/Aşağı = Safari Scroll"
);

console.log(
    "BLE-M3 Click = Play/Pause"
);

console.log(
    "Çift dokunma = Çekim modundan çık"
);
