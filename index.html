<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>BLE-M3 Test</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #080808;
    color: white;
    font-family: Arial, sans-serif;
    min-height: 100vh;
    padding: 25px;
}

h1 {
    text-align: center;
    font-size: 28px;
    margin-bottom: 10px;
}

.info {
    text-align: center;
    color: #aaa;
    line-height: 1.5;
    margin-bottom: 25px;
}

#status {
    text-align: center;
    padding: 15px;
    background: #151515;
    border-radius: 12px;
    margin-bottom: 20px;
}

#lastEvent {
    background: #202020;
    border-radius: 15px;
    padding: 25px;
    text-align: center;
    margin-bottom: 20px;
}

#eventName {
    font-size: 38px;
    font-weight: bold;
    margin-top: 10px;
    color: #fff;
}

#eventCode {
    margin-top: 10px;
    color: #aaa;
    font-size: 16px;
}

#log {
    background: #050505;
    border: 1px solid #333;
    border-radius: 12px;
    padding: 15px;
    min-height: 250px;
    font-family: monospace;
    font-size: 15px;
    overflow-y: auto;
}

.log-item {
    padding: 8px 0;
    border-bottom: 1px solid #222;
}

button {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 10px;
    background: #333;
    color: white;
    font-size: 17px;
    margin-top: 15px;
}

button:active {
    transform: scale(.98);
}

</style>
</head>

<body>

<h1>BLE-M3 Test</h1>

<div class="info">
    Kumandanı Bluetooth ile iPad'e bağla.<br>
    AssistiveTouch açık olsun.<br><br>

    Şimdi kumandadaki tuşlara <strong>tek tek</strong> bas.
</div>

<div id="status">
    Safari klavye/giriş olaylarını bekliyor...
</div>

<div id="lastEvent">

    Son algılanan olay:

    <div id="eventName">
        Henüz yok
    </div>

    <div id="eventCode">
        —
    </div>

</div>

<div id="log"></div>

<button onclick="clearLog()">
    TESTİ TEMİZLE
</button>

<script>

/* =====================================================
   BLE-M3 / SAFARI EVENT TESTER
===================================================== */

const eventName =
    document.getElementById("eventName");

const eventCode =
    document.getElementById("eventCode");

const log =
    document.getElementById("log");

const status =
    document.getElementById("status");


/* =====================================================
   KLAVYE OLAYI
===================================================== */

document.addEventListener(
    "keydown",
    function(event) {

        event.preventDefault();

        showEvent(
            "KEYDOWN",
            event
        );

    },
    true
);


document.addEventListener(
    "keyup",
    function(event) {

        event.preventDefault();

        showEvent(
            "KEYUP",
            event
        );

    },
    true
);


/* =====================================================
   CLICK
===================================================== */

document.addEventListener(
    "click",
    function(event) {

        showPointerEvent(
            "CLICK",
            event
        );

    },
    true
);


/* =====================================================
   POINTER DOWN
===================================================== */

document.addEventListener(
    "pointerdown",
    function(event) {

        showPointerEvent(
            "POINTER DOWN",
            event
        );

    },
    true
);


/* =====================================================
   POINTER UP
===================================================== */

document.addEventListener(
    "pointerup",
    function(event) {

        showPointerEvent(
            "POINTER UP",
            event
        );

    },
    true
);


/* =====================================================
   TOUCH
===================================================== */

document.addEventListener(
    "touchstart",
    function(event) {

        showSimpleEvent(
            "TOUCH START"
        );

    },
    true
);


document.addEventListener(
    "touchend",
    function(event) {

        showSimpleEvent(
            "TOUCH END"
        );

    },
    true
);


/* =====================================================
   KLAVYE EVENT GÖSTER
===================================================== */

function showEvent(type, event) {

    const name =
        event.key || "Bilinmiyor";

    const code =
        event.code || "Bilinmiyor";

    const keyCode =
        event.keyCode || "—";

    eventName.innerText =
        name;

    eventCode.innerText =
        "code: " +
        code +
        " | keyCode: " +
        keyCode +
        " | type: " +
        type;

    status.innerText =
        "Klavye olayı algılandı";

    addLog(
        type +
        " → key: [" +
        name +
        "] | code: [" +
        code +
        "] | keyCode: [" +
        keyCode +
        "]"
    );

}


/* =====================================================
   POINTER EVENT
===================================================== */

function showPointerEvent(type, event) {

    eventName.innerText =
        type;

    eventCode.innerText =
        "pointerType: " +
        (event.pointerType || "—") +
        " | button: " +
        (event.button ?? "—");

    status.innerText =
        "Pointer olayı algılandı";

    addLog(
        type +
        " → pointerType: [" +
        (event.pointerType || "—") +
        "] | button: [" +
        (event.button ?? "—") +
        "]"
    );

}


/* =====================================================
   BASİT EVENT
===================================================== */

function showSimpleEvent(type) {

    eventName.innerText =
        type;

    eventCode.innerText =
        "Safari bu olayı algıladı.";

    status.innerText =
        "Dokunmatik olay algılandı";

    addLog(type);

}


/* =====================================================
   LOG
===================================================== */

function addLog(message) {

    const item =
        document.createElement("div");

    item.className =
        "log-item";

    const time =
        new Date().toLocaleTimeString();

    item.innerText =
        "[" +
        time +
        "] " +
        message;

    log.prepend(item);

}


/* =====================================================
   TEMİZLE
===================================================== */

function clearLog() {

    log.innerHTML = "";

    eventName.innerText =
        "Henüz yok";

    eventCode.innerText =
        "—";

    status.innerText =
        "Test temizlendi";

}

</script>

</body>
</html>
