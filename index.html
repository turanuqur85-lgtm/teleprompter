<!DOCTYPE html>
<html lang="tr">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
maximum-scale=1.0,
user-scalable=no">

<title>BLE-M3 Test 2</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #080808;
    color: white;
    font-family: Arial, sans-serif;
}

body {
    padding: 20px;
    overflow: hidden;
}

h1 {
    text-align: center;
    margin: 10px 0;
}

.info {
    text-align: center;
    color: #aaa;
    line-height: 1.5;
    margin-bottom: 20px;
}

#last {
    background: #181818;
    border-radius: 15px;
    padding: 25px;
    text-align: center;
    margin-bottom: 15px;
}

#event {
    font-size: 30px;
    font-weight: bold;
    margin-top: 10px;
}

#details {
    color: #aaa;
    margin-top: 10px;
}

#movement {
    background: #111;
    border: 2px solid #333;
    border-radius: 15px;
    padding: 25px;
    text-align: center;
    margin-bottom: 15px;
}

#direction {
    font-size: 40px;
    font-weight: bold;
}

#values {
    color: #aaa;
    margin-top: 10px;
}

#log {
    height: 35vh;
    overflow-y: auto;
    background: #050505;
    border: 1px solid #333;
    border-radius: 12px;
    padding: 10px;
    font-family: monospace;
    font-size: 14px;
}

.log {
    padding: 7px 0;
    border-bottom: 1px solid #222;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 12px;
    border: 0;
    border-radius: 10px;
    background: #333;
    color: white;
    font-size: 17px;
}

</style>

</head>

<body>

<h1>BLE-M3 TEST 2</h1>

<div class="info">

Bluetooth + AssistiveTouch açık olsun.<br><br>

Şimdi kumandayı kullanarak:<br>

<strong>
1. Yukarı hareket ettir<br>
2. Aşağı hareket ettir<br>
3. Ekrana bas
</strong>

</div>


<div id="last">

Son olay:

<div id="event">
Henüz yok
</div>

<div id="details">
—
</div>

</div>


<div id="movement">

Hareket:

<div id="direction">
BEKLENİYOR
</div>

<div id="values">
X: 0 | Y: 0
</div>

</div>


<div id="log"></div>


<button onclick="clearLog()">
TESTİ TEMİZLE
</button>


<script>

/* =========================================
   ELEMANLAR
========================================= */

const eventBox =
document.getElementById("event");

const detailsBox =
document.getElementById("details");

const directionBox =
document.getElementById("direction");

const valuesBox =
document.getElementById("values");

const logBox =
document.getElementById("log");


/* =========================================
   POINTER DOWN
========================================= */

document.addEventListener(
"pointerdown",
function(e) {

    show(
        "POINTER DOWN",
        "pointerType: " +
        e.pointerType +
        " | button: " +
        e.button
    );

},
true
);


/* =========================================
   POINTER UP
========================================= */

document.addEventListener(
"pointerup",
function(e) {

    show(
        "POINTER UP",
        "pointerType: " +
        e.pointerType +
        " | button: " +
        e.button
    );

},
true
);


/* =========================================
   CLICK
========================================= */

document.addEventListener(
"click",
function(e) {

    show(
        "CLICK",
        "pointerType: " +
        e.pointerType +
        " | button: " +
        e.button
    );

},
true
);


/* =========================================
   POINTER MOVE
========================================= */

let lastX = null;
let lastY = null;

document.addEventListener(
"pointermove",
function(e) {

    let x =
        e.clientX;

    let y =
        e.clientY;


    if (
        lastX === null ||
        lastY === null
    ) {

        lastX = x;
        lastY = y;

        return;

    }


    let dx =
        x - lastX;

    let dy =
        y - lastY;


    /*
       Çok küçük hareketleri
       filtreliyoruz.
    */

    if (
        Math.abs(dx) < 1 &&
        Math.abs(dy) < 1
    ) {

        return;

    }


    let direction =
        "HAREKET";


    if (
        Math.abs(dy) >
        Math.abs(dx)
    ) {

        if (dy < 0) {

            direction =
                "⬆️ YUKARI";

        } else {

            direction =
                "⬇️ AŞAĞI";

        }

    } else {

        if (dx > 0) {

            direction =
                "➡️ SAĞ";

        } else {

            direction =
                "⬅️ SOL";

        }

    }


    directionBox.innerText =
        direction;


    valuesBox.innerText =
        "X: " +
        dx.toFixed(1) +
        " | Y: " +
        dy.toFixed(1);


    addLog(
        "POINTER MOVE → " +
        direction +
        " | dx=" +
        dx.toFixed(1) +
        " | dy=" +
        dy.toFixed(1) +
        " | pointer=" +
        e.pointerType
    );


    lastX = x;
    lastY = y;

},
true
);


/* =========================================
   WHEEL
========================================= */

document.addEventListener(
"wheel",
function(e) {

    show(
        "WHEEL",
        "deltaX: " +
        e.deltaX +
        " | deltaY: " +
        e.deltaY
    );

    addLog(
        "WHEEL → deltaY=" +
        e.deltaY
    );

},
true
);


/* =========================================
   TOUCH
========================================= */

document.addEventListener(
"touchstart",
function() {

    show(
        "TOUCH START",
        "Safari touch olayı"
    );

},
true
);


document.addEventListener(
"touchend",
function() {

    show(
        "TOUCH END",
        "Safari touch olayı"
    );

},
true
);


/* =========================================
   GÖSTER
========================================= */

function show(
    name,
    details
) {

    eventBox.innerText =
        name;

    detailsBox.innerText =
        details;

    addLog(
        name +
        " → " +
        details
    );

}


/* =========================================
   LOG
========================================= */

function addLog(message) {

    const div =
        document.createElement("div");

    div.className =
        "log";

    const time =
        new Date()
        .toLocaleTimeString();

    div.innerText =
        "[" +
        time +
        "] " +
        message;

    logBox.prepend(div);

}


/* =========================================
   TEMİZLE
========================================= */

function clearLog() {

    logBox.innerHTML = "";

    eventBox.innerText =
        "Henüz yok";

    detailsBox.innerText =
        "—";

    directionBox.innerText =
        "BEKLENİYOR";

    valuesBox.innerText =
        "X: 0 | Y: 0";

    lastX = null;
    lastY = null;

}

</script>

</body>
</html>
